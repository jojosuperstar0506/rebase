name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build

  api-tests:
    name: API tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Node tests
        run: node --test tests/

  competitor-intel-tests:
    name: Competitor-intel tests (Python)
    runs-on: ubuntu-latest
    # Two tests have date-drift bugs (hardcoded 2026-03 dates) — flag failures
    # but don't block PRs until they're fixed. Remove this once that's done.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install pytest anthropic
      - name: Run tests
        run: pytest services/competitor-intel/ -v --import-mode=importlib
